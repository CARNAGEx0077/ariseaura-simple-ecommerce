<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arise Aura - Content Manager</title>
  </head>
  <body>
    <!-- Decap CMS will mount here -->
    <div id="nc-root"></div>

    <!-- 1. Signal manual init BEFORE the Decap bundle loads -->
    <script>
      window.CMS_MANUAL_INIT = true;
    </script>

    <!-- 2. Load Decap CMS bundle -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

    <!-- 3. Initialize CMS after bundle and mount element are both ready -->
    <script>
      CMS.init({
        config: {
          backend: {
            name: 'github',
            repo: 'CARNAGEx0077/ariseaura-simple-ecommerce',
            branch: 'main',
            base_url: 'https://ariseaura-simple-ecommerce.vercel.app',
            auth_endpoint: 'api/auth'
          },
          load_config_file: false,
          media_folder: "assets/uploads",
          public_folder: "./assets/uploads",
          collections: [
            {
              name: "products",
              label: "Products",
              folder: "content/products",
              create: true,
              format: "json",
              slug: "{{slug}}",
              fields: [
                {label: "Product Name", name: "name", widget: "string"},
                {label: "Price", name: "price", widget: "number", value_type: "int"},
                {label: "Category", name: "category", widget: "select", options: ["Football", "Basketball", "Cricket", "Soccer", "Baseball", "Running", "Training", "Pants", "T-Shirts", "Hoodies"]},
                {label: "Description", name: "description", widget: "text", required: false},
                {label: "Sizes", name: "sizes", widget: "list", default: ["S", "M", "L", "XL", "2XL"]},
                {label: "Color", name: "color", widget: "string", required: false},
                {label: "Product Image", name: "image", widget: "image"},
                {label: "Featured Product", name: "featured", widget: "boolean", default: false, required: false},
                {label: "Available", name: "available", widget: "boolean", default: true, required: false}
              ]
            }
          ]
        }
      });
    </script>
  </body>
</html>
